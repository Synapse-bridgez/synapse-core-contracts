name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  event-decoder-covers-catalogued-topics:
    name: event_decoder_covers_catalogued_topics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The filter string below MUST match the test name in
      # src/test_events_conformance.rs. A filter that matches zero tests
      # exits 0 and looks green, so we first assert the test is actually
      # discovered via `--list` before running it.
      - name: Assert the filtered test is discovered
        run: |
          set -euo pipefail
          listed="$(cargo test event_decoder_covers_catalogued_topics -- --list)"
          echo "$listed"
          if ! grep -q 'event_decoder_covers_catalogued_topics' <<<"$listed"; then
            echo "::error::Filter 'event_decoder_covers_catalogued_topics' matched 0 tests"
            exit 1
          fi
      - name: Run event decoder coverage test
        run: cargo test event_decoder_covers_catalogued_topics

  doc-coverage:
    name: Doc coverage (missing_docs gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The crate root carries `#![deny(missing_docs)]`, so any undocumented
      # public item (contractimpl entry point, public struct/enum/field, or
      # ContractError variant) fails this build. RUSTDOCFLAGS turns rustdoc
      # warnings into errors as a second line of defence for doc links.
      - name: Enforce public-API doc-comment coverage
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  wasm:
    name: Wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-unknown-unknown --release

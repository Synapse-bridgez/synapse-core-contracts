name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build wasm
        run: cargo build --target wasm32-unknown-unknown --release

      # Run the event-emission benchmarks and surface the [bench] output as a
      # tracked (non-gating) metric in the CI log.  The bench_wave7_cumulative_cost
      # test asserts regression ceilings, so a genuine budget blow-out will
      # already fail the "Run tests" step above; this step prints the raw numbers
      # for trend-tracking across PRs.
      #
      # To grep these numbers out of CI logs:
      #   grep '\[bench\]' <logfile>
      - name: Event-emission benchmarks (tracked metric)
        run: |
          echo "::group::Event emission cost breakdown"
          cargo test bench_ -- --nocapture 2>&1 | grep -E '^\[bench\]|^test bench_'
          echo "::endgroup::"

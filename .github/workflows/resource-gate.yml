name: Resource gate

# Resource-usage regression gate (#119).
#
# Builds the release WASM, meters every hot entry point under Soroban's budget
# (src/bench_resources.rs) and fails if any scenario's cpu_insns / mem_bytes
# exceeds resource_baseline.toml by more than its threshold_pct.
#
# Soroban metering is deterministic, so runner noise does not matter — but the
# numbers depend on the exact WASM, and therefore on the rustc that built it.
# RUST_TOOLCHAIN is pinned to the version resource_baseline.toml was generated
# with; bump both together (see COST_MODEL.md §12).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  resource-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-resource-gate-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release wasm
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Gate unit tests (comparison logic, baseline coverage)
        run: cargo test --lib "bench_resources::"

      - name: Resource-usage gate
        run: scripts/check_resource_budget.sh

      # Negative fixtures: prove the gate is not vacuous. Inflating one entry
      # point past the threshold must fail; staying inside it must pass.
      - name: Gate self-test — injected +25% regression must fail
        run: scripts/check_resource_budget.sh --inject register_callback:25 --expect-fail

      - name: Gate self-test — injected +10% (under threshold) must pass
        run: scripts/check_resource_budget.sh --inject register_callback:10
